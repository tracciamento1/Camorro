<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>تسجيل دخول كامورو</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, Cantarell, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body{
    background:#0f1c2e; 
    color:white;
    height: 100vh;
    height: -webkit-fill-available; /* لحل مشاكل المتصفحات على الهواتف */
    display:flex;
    justify-content:center;
    align-items:center;
    overflow: hidden;
}

/* ===== شاشة البدء المعدلة (SPLASH APP) ===== */
.splash{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#0f1c2e;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition: opacity 0.5s ease;
    /* إضافة حماية سفلية لمنع اختفاء النصوص تحت حافة الشاشة */
    padding-bottom: env(safe-area-inset-bottom, 40px); 
}

.splash svg{
    width:110px; /* تم تصغيره قليلاً ليتناسق */
    height:110px;
    margin-bottom: 20px;
}

.metaSplash {
    position: absolute;
    bottom: calc(40px + env(safe-area-inset-bottom)); /* رفع النص ديناميكياً للأعلى */
    text-align: center;
    color: #8e9aa8;
    font-size: 14px;
    letter-spacing: 1px;
    width: 100%;
}

.metaSplash strong{
    font-size:22px;
    background: linear-gradient(45deg, #ffe082, #ffb300, #b78103);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    display: block;
    margin-top: 5px;
    font-weight: 700;
}

/* ===== حاوية الهاتف (MOBILE CONTAINER) ===== */
.container{
    display:none;
    width:100%;
    max-width:414px; 
    height:100%;
    padding: 30px 24px calc(20px + env(safe-area-inset-bottom)) 24px;
    flex-direction:column;
    align-items:center;
    justify-content: space-between;
}

.container.active{
    display:flex;
}

/* ===== المحتوى الرئيسي لتسجيل الدخول ===== */
.main-content {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 30px;
}

.logo{
    margin-bottom:40px;
    display:flex;
    justify-content:center;
}

.logo svg{
    width:90px;
    height:90px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    border-radius: 24px;
}

.input-box{
    width:100%;
    margin-bottom:16px;
}

.input-box input{
    width:100%;
    height:56px;
    border: 1.5px solid #22354f;
    border-radius:16px;
    background:#16263d;
    color:white;
    font-size:15px;
    padding:0 18px;
    outline:none;
    transition: 0.2s;
    text-align: right;
}

.input-box input:focus {
    border-color: #ffb300; 
}

.input-box input::placeholder{
    color:#738499;
}

.login-btn{
    width:100%;
    height:54px;
    border:none;
    border-radius:27px;
    background: linear-gradient(90deg, #ffb300, #b78103); 
    color:#0f1c2e;
    font-size:16px;
    font-weight: bold;
    cursor:pointer;
    transition:0.3s;
    margin-top: 10px;
    box-shadow: 0 4px 15px rgba(255, 179, 0, 0.2);
}

.forgot{
    margin-top:22px;
    color:#ffb300;
    text-decoration:none;
    font-size:14px;
    font-weight: 500;
    background: transparent;
    border: none;
    cursor: pointer;
}

.bottom{
    width:100%;
    text-align:center;
}

.create{
    width:100%;
    height:50px;
    border:1.5px solid #ffb300;
    border-radius:25px;
    background:transparent;
    color:#ffb300;
    font-size:15px;
    font-weight: 600;
    cursor:pointer;
}

.meta{
    margin-top:15px;
    font-size:14px;
    color:#8e9aa8;
    font-weight: 500;
}

/* ===== التحقق الثنائي (2FA MOBILE) ===== */
.twofa-container{
    display:none;
    width:100%;
    max-width:414px;
    height:100%;
    padding: 40px 24px calc(20px + env(safe-area-inset-bottom)) 24px;
    flex-direction:column;
    justify-content:flex-start;
}

.twofa-container.active{
    display:flex;
}

.back{
    font-size:26px;
    margin-bottom:25px;
    cursor:pointer;
    width:40px;
    color: #ffb300;
    text-align: right;
}

h1{
    font-size:26px;
    margin-bottom:8px;
    font-weight: 700;
    text-align: right;
    width: 100%;
}

.sub{
    font-size:14px;
    color:#a0b0c0;
    margin-bottom:30px;
    text-align: right;
    width: 100%;
}

.code-inputs{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:15px;
    direction: ltr; 
}

.code-inputs input{
    width:48px;
    height:54px;
    text-align:center;
    font-size:20px;
    font-weight: bold;
    border-radius:12px;
    border:1.5px solid #22354f;
    background:#16263d;
    color:white;
    outline:none;
    transition: 0.2s;
}

.code-inputs input:focus{
    border-color:#ffb300;
}

.error-msg{
    color:#ff5252;
    font-size:13px;
    display:none;
    margin-bottom:15px;
    text-align:center;
}

.success-msg{
    color:#4ade80;
    font-size:14px;
    display:none;
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.info{
    font-size:13px;
    color:#8e9aa8;
    margin:15px 0;
    line-height:1.5;
    text-align:center;
}

.link{
    color:#ffb300;
    font-size:14px;
    margin-top:5px;
    cursor:pointer;
    text-align:center;
    font-weight: 500;
}

.action-buttons {
    margin-top: auto;
    width: 100%;
}

.primary{
    background: linear-gradient(90deg, #ffb300, #b78103);
    color:#0f1c2e;
    font-weight: bold;
    height: 52px;
    border: none;
    border-radius: 26px;
    font-size: 16px;
    cursor: pointer;
    width: 100%;
}

.secondary{
    background:#16263d;
    color:#8e9aa8;
    height: 50px;
    border: 1.5px solid #22354f;
    border-radius: 25px;
    font-size: 15px;
    margin-top:12px;
    cursor: pointer;
    width: 100%;
}

/* ===== شاشة تحميل ===== */
.loading-screen{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background:#0f1c2e;
    z-index:99999; 
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:15px;
    touch-action: none; 
    user-select: none;   
}

.loading-screen .spinner{
    width:42px;
    height:42px;
    border:4px solid #16263d;
    border-top-color:#ffb300;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.loading-screen p{
    font-size:15px;
    color:#8e9aa8;
}
</style>
</head>
<body>

<!-- شاشة البدء (SPLASH SCREEN) -->
<div class="splash" id="splash">
    <svg viewBox="0 0 100 100" fill="none">
        <defs>
            <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#FFE082"/>
                <stop offset="30%" stop-color="#FFD54F"/>
                <stop offset="70%" stop-color="#FFB300"/>
                <stop offset="100%" stop-color="#B78103"/>
            </linearGradient>
        </defs>
        <rect width="100" height="100" rx="28" fill="#16263d"/>
        <circle cx="50" cy="50" r="34" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-dasharray="14 6"/>
        <path d="M30 66 V34 L50 52 L70 34 V66" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="metaSplash">
        <span>من طرف</span>
        <strong style="margin-top: 8px;">Camorro</strong>
    </div>
</div>

<!-- شاشة انتظر/جاري التحميل -->
<div class="loading-screen" id="loadingScreen">
    <div class="spinner"></div>
    <p id="loadingText">جاري التحقق من البيانات...</p>
</div>

<!-- واجهة تسجيل الدخول الرئيسي -->
<div class="container active" id="loginContainer">
    <div class="main-content">
        <div class="logo">
            <svg viewBox="0 0 100 100" fill="none">
                <rect width="100" height="100" rx="28" fill="#16263d"/>
                <circle cx="50" cy="50" r="34" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-dasharray="14 6"/>
                <path d="M30 66 V34 L50 52 L70 34 V66" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <div class="input-box">
            <input type="text" id="username" placeholder="اسم المستخدم أو البريد الإلكتروني">
        </div>
        <div class="input-box">
            <input type="password" id="password" placeholder="كلمة المرور">
        </div>

        <button class="login-btn" id="loginBtn">تسجيل الدخول</button>
        <button class="forgot" id="forgotBtn">هل نسيت كلمة السر؟</button>
    </div>

    <div class="bottom">
        <button class="create">إنشاء حساب جديد</button>
        <div class="meta" style="margin-top:15px;">من طرف <strong style="color: #ffb300;">Camorro</strong></div>
    </div>
</div>

<!-- واجهة التحقق الثنائي (2FA MOBILE) -->
<div class="twofa-container" id="twofaContainer">
    <div class="back" id="backBtn">→</div>
    <h1>رمز التحقق</h1>
    <div class="sub">أدخل الرمز المكون من 6 أرقام المرسل إلى هاتفك.</div>
    
    <div class="code-inputs">
        <input type="text" maxlength="1" pattern="\d*">
        <input type="text" maxlength="1" pattern="\d*">
        <input type="text" maxlength="1" pattern="\d*">
        <input type="text" maxlength="1" pattern="\d*">
        <input type="text" maxlength="1" pattern="\d*">
        <input type="text" maxlength="1" pattern="\d*">
    </div>

    <div class="error-msg" id="errorMsg">الرمز غير صحيح، يرجى المحاولة مرة أخرى.</div>
    <div class="success-msg" id="successMsg">تم التحقق بنجاح! جاري الدخول...</div>

    <div class="info">لم يصلك الرمز؟ يمكنك إعادة الإرسال خلال 55 ثانية</div>
    <div class="link">إعادة إرسال الرمز</div>

    <div class="action-buttons">
        <button class="primary" id="verifyBtn">تأكيد الرمز</button>
        <button class="secondary" id="cancel2faBtn">إلغاء</button>
    </div>
</div>

<!-- البرمجة التفاعلية (JavaScript) -->
<script>
